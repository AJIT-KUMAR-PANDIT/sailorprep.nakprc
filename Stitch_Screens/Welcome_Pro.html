<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sailor Prep - Welcome</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#eff1f2",
                        "outline": "#70797b",
                        "surface-bright": "#f8f9fa",
                        "on-tertiary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "secondary": "#46636d",
                        "inverse-primary": "#93d0e0",
                        "tertiary-container": "#9f6840",
                        "secondary-fixed-dim": "#adcbd7",
                        "on-primary-fixed-variant": "#004e5c",
                        "surface-container-high": "#e7e8e9",
                        "on-primary-fixed": "#001f26",
                        "on-tertiary": "#ffffff",
                        "surface": "#f8f9fa",
                        "surface-container": "#eceeef",
                        "surface-container-highest": "#e1e3e4",
                        "inverse-surface": "#2e3132",
                        "primary": "#226472",
                        "surface-dim": "#d8dadb",
                        "on-primary-container": "#f9fdff",
                        "primary-fixed-dim": "#93d0e0",
                        "on-surface": "#191c1d",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#001f27",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f2f4f5",
                        "on-secondary-fixed-variant": "#2e4b54",
                        "on-tertiary-fixed-variant": "#693b17",
                        "secondary-fixed": "#c9e8f3",
                        "tertiary": "#82502a",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#fcb88a",
                        "on-secondary-container": "#4a6771",
                        "primary-container": "#3f7d8c",
                        "surface-tint": "#256675",
                        "tertiary-fixed": "#ffdcc6",
                        "on-tertiary-fixed": "#301400",
                        "outline-variant": "#bfc8cb",
                        "on-error": "#ffffff",
                        "primary-fixed": "#afecfd",
                        "on-surface-variant": "#40484b",
                        "on-background": "#191c1d",
                        "background": "#f8f9fa",
                        "secondary-container": "#c6e5f0",
                        "surface-variant": "#e1e3e4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "margin-mobile": "16px",
                        "container-max": "1120px",
                        "base": "4px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["manrope"],
                        "label-sm": ["inter"],
                        "headline-md": ["manrope"],
                        "label-md": ["inter"],
                        "headline-lg": ["manrope"],
                        "headline-lg-mobile": ["manrope"],
                        "body-lg": ["inter"],
                        "body-md": ["inter"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    },
                    "animation": {
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                        'pulse-glow': 'pulseGlow 2s infinite',
                        'blob': 'blob 7s infinite',
                    },
                    "keyframes": {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(34, 100, 114, 0.4)' },
                            '50%': { boxShadow: '0 0 0 10px rgba(34, 100, 114, 0)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
    
    .glass-panel {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="bg-background text-on-background h-full flex flex-col font-body-md overflow-hidden antialiased relative">
<!-- Abstract Blurred Background -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-fixed rounded-full mix-blend-multiply filter blur-[100px] opacity-50 animate-blob"></div>
<div class="absolute top-[20%] right-[-10%] w-[40%] h-[40%] bg-secondary-fixed rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob" style="animation-delay: 2s;"></div>
<div class="absolute bottom-[-20%] left-[20%] w-[60%] h-[60%] bg-primary-fixed-dim rounded-full mix-blend-multiply filter blur-[120px] opacity-30 animate-blob" style="animation-delay: 4s;"></div>
</div>
<!-- Decorative Bottom Wave Element -->
<div class="absolute bottom-0 inset-x-0 z-0 overflow-hidden flex items-end pointer-events-none opacity-40">
<svg class="w-full h-auto text-primary-fixed" preserveaspectratio="none" viewbox="0 0 1440 320">
<path d="M0,288L48,272C96,256,192,224,288,197.3C384,171,480,149,576,165.3C672,181,768,235,864,250.7C960,267,1056,245,1152,224C1248,203,1344,181,1392,170.7L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z" fill="currentColor"></path>
</svg>
</div>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center relative px-margin-mobile md:px-margin-desktop z-10 w-full max-w-container-max mx-auto h-full">
<div class="z-10 flex flex-col items-center text-center w-full max-w-md animate-fade-in-up">
<!-- Hero Illustration/Icon -->
<div class="mb-10 relative group">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-xl group-hover:bg-primary/30 transition-all duration-500 scale-110"></div>
<div class="w-32 h-32 md:w-36 md:h-36 rounded-full glass-panel flex items-center justify-center relative z-10">
<span class="material-symbols-outlined text-primary text-6xl md:text-7xl" style="font-variation-settings: 'FILL' 1;">
                        sailing
                    </span>
</div>
</div>
<!-- Typography -->
<div class="space-y-4 mb-12 glass-panel p-8 rounded-3xl w-full">
<h1 class="font-display-lg text-display-lg md:font-display-lg md:text-display-lg text-on-surface bg-clip-text text-transparent bg-gradient-to-r from-primary to-primary-container">
                    Master Your Maritime Exams
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">
                    The comprehensive study companion for merchant navy professionals.
                </p>
</div>
<!-- Actions -->
<div class="w-full flex flex-col space-y-4">
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-label-md text-label-md py-4 px-6 rounded-xl shadow-lg shadow-primary/20 transition-all duration-300 flex items-center justify-center space-x-2 animate-pulse-glow hover:scale-[1.02]">
<span>Set Sail</span>
<span class="material-symbols-outlined text-[18px]">
                        arrow_forward
                    </span>
</button>
<button class="w-full glass-panel hover:bg-surface-container-low text-primary font-label-md text-label-md py-4 px-6 rounded-xl transition-all duration-200">
                    Log In
                </button>
</div>
</div>
</main>
</body></html>
